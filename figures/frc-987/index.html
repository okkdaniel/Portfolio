<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FRC 987 · lines</title>
    <style>
      :root { --paper: #f3f0e8; --ink: #1f231e; --dim: #666b62; --faint: #9a9d93; --hair: rgba(31, 35, 30, 0.14); }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 12px/1.5 "JetBrains Mono", ui-monospace, monospace; }
      main { width: min(720px, 100vw - 32px); }
      .plate { position: relative; border: 1px solid var(--hair); border-radius: 14px; overflow: hidden; aspect-ratio: 5 / 6; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .tag { position: absolute; top: 12px; font-size: 11px; color: var(--dim); pointer-events: none; }
      #name { left: 14px; } #read { right: 14px; color: var(--ink); }
      .controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; color: var(--faint); font-size: 11px; }
      input[type="range"] { flex: 1; accent-color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <div class="plate">
        <span class="tag" id="name">frc 987 · 2025 offseason</span>
        <span class="tag" id="read">loading</span>
        <canvas id="c"></canvas>
      </div>
      <div class="controls"><span>arm angle</span><input id="angle" type="range" min="40" max="85" step="0.01" value="68.36" /><span id="angleOut">68.36°</span></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
