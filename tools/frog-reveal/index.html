<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frog reveal</title>
    <style>
      /* A checkerboard behind the canvas, only so transparency shows here. */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 24px 24px;
      }
      canvas { max-width: 100vw; max-height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module" src="./reveal.js"></script>
  </body>
</html>
